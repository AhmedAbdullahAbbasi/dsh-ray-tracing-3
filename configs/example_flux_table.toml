# Runnable synthetic integration example; 64 packets do not establish convergence.
# All source fluxes are intrinsic observer-equivalent ph cm^-2 s^-1.
config_version = 1

[run]
name = "example_flux_table"

[scene]
kind = "example_four_cloud"
source_distance_kpc = 10.0
coordinates = "source_centered_offsets"

[source]
# Synthetic MJD table: column 2 is deliberately NOT a flux column.
kind = "flux_table"
file = "data/example_flux.txt"
time_column = 1
flux_columns = [3, 4, 5]
column_numbering = "one_based_full_table"
time_format = "mjd"
time_scale = "TT"
epoch_mjd = 60000.0
interval_policy = "hold_until_next"
last_interval_days = 0.5
max_interval_days = 0.5
missing_data = "error"
flux_convention = "unabsorbed observer-equivalent"
flux_unit = "ph cm^-2 s^-1"
flux_scale = 1.0
spectral_mode = "band_powerlaw"
energy_edges_kev = [2.0, 4.0, 6.0, 10.0]
photon_index = 1.7

[materials]
kind = "declared_bundle"
directory = "../dsh/data/materials/wd01_wilm_c50_si90_v1"

[execution]
packets = 64
chunk_size = 32
max_interactions = 32
seed = 2026
device = "cpu"
launch_sampler = "radial"

[observer]
energy_edges_kev = [2.0, 4.0, 6.0, 10.0]

[observer.arrival]
kind = "explicit"
edges_days = [0.0, 10.0, 20.0, 30.0, 40.0, 50.0, 60.0]

[output]
directory = "../outputs/example_flux_table"
formats = ["npz", "fits"]
overwrite = false

[plots]
enabled = true
scales = ["log", "linear"]
epoch_days = [0.0, 20.0]
save_scored_event_map = true
