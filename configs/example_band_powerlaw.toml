# Runnable synthetic integration example; 64 packets do not establish convergence.
# All source fluxes are intrinsic observer-equivalent ph cm^-2 s^-1.
config_version = 1

[run]
name = "example_band_powerlaw"

[scene]
kind = "example_four_cloud"
source_distance_kpc = 10.0
coordinates = "source_centered_offsets"

[source]
# Each row contains independently integrated fluxes in the three bands.
kind = "band_powerlaw"
time_edges_days = [0.0, 0.5, 1.0]
energy_edges_kev = [2.0, 4.0, 6.0, 10.0]
band_flux = [[0.020, 0.012, 0.006], [0.010, 0.006, 0.003]]
photon_index = 1.7

[materials]
kind = "declared_bundle"
directory = "../dsh/data/materials/wd01_wilm_c50_si90_v1"

[execution]
packets = 64
chunk_size = 32
max_interactions = 32
seed = 2026
device = "cpu"
launch_sampler = "radial"

[observer]
energy_edges_kev = [2.0, 4.0, 6.0, 10.0]

[observer.arrival]
kind = "explicit"
edges_days = [0.0, 10.0, 20.0, 30.0, 40.0, 50.0, 60.0]

[output]
directory = "../outputs/example_band_powerlaw"
formats = ["npz", "fits"]
overwrite = false

[plots]
enabled = true
scales = ["log", "linear"]
epoch_days = [0.0, 20.0]
save_scored_event_map = true
